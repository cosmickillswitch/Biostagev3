<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Clayframe</title>
<meta name="theme-color" content="#17171D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Clayframe · a sculpt-and-animate app. Big 3D view, mode tabs, a timeline and a tool row; panels pop up over the lower half on phones and dock right on wide screens. */
:root{
  --bg:#0E0E12;--panel:#17171D;--panel2:#202029;--panel3:#2A2A35;--ink:#EEEDF2;--muted:#9393A6;--rule:#2B2B37;--field:#101015;
  --accent:#E9A15B;--accent-ink:#1E1004;--key:#F2B35E;--sel:#5BC0FF;--danger:#F2685B;--rec:#FF4D57;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --barh:50px;--sheetw:370px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,select,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:.82rem;margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.bar{height:var(--barh);flex:none;display:flex;align-items:center;gap:6px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;flex:none}
.brand svg{width:30px;height:30px;border-radius:8px}
.brand b{font-weight:600;letter-spacing:-.01em}
@media (max-width:440px){.brand b{display:none}}
#proj{max-width:160px;min-width:0;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:6px 8px;min-height:36px}
.btn{border:1px solid var(--rule);background:var(--panel2);border-radius:9px;padding:7px 13px;min-height:38px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent}
.btn.danger{color:var(--danger)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.iconbtn{background:transparent;border:1px solid transparent;border-radius:9px;min-width:38px;min-height:38px;display:inline-grid;place-items:center;font-size:1.05rem;padding:0 6px}
.iconbtn:hover{background:var(--panel2)}
.iconbtn:disabled{opacity:.35}
.tog[aria-pressed="true"]{background:var(--panel3);border-color:var(--accent);color:var(--accent)}
.iconbtn.rec[aria-pressed="true"]{color:var(--rec);border-color:var(--rec)}

.main{flex:1;min-height:0;display:flex;flex-direction:column}
.viewwrap{position:relative;flex:1;min-height:180px;background:#24242A;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#view,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
.sliders{position:absolute;left:8px;top:12px;bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:18px;pointer-events:none}
.vs{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(14,14,18,.55);border-radius:14px;padding:8px 6px;backdrop-filter:blur(6px)}
.vs span{font-size:.68rem;color:var(--muted)}
.vs input{writing-mode:vertical-lr;direction:rtl;width:30px;height:clamp(80px,22vh,170px);accent-color:var(--accent);margin:0}
.viewbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.vbtn{background:rgba(14,14,18,.6);border:1px solid var(--rule);border-radius:10px;min-width:44px;min-height:38px;padding:0 8px;font-size:.85rem;backdrop-filter:blur(6px)}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(14,14,18,.8);border:1px solid var(--accent);border-radius:99px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 130px);font-size:.85rem}
.banner .btn{min-height:30px;padding:3px 10px}

.modes{flex:none;display:flex;gap:2px;padding:4px 8px;background:var(--panel);border-top:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.modes button{flex:1;min-width:64px;border:0;background:transparent;border-radius:8px;padding:6px 4px;font-weight:600;font-size:.85rem;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--panel3);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}

.transport{flex:none;display:flex;align-items:center;gap:4px;padding:2px 8px;background:var(--panel);border-top:1px solid var(--rule)}
.playbtn{width:40px;height:36px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.time{font-family:var(--f-mono);font-size:.85rem;margin-left:6px}
.keybtn{background:transparent;border:1px solid var(--rule);border-radius:8px;min-width:34px;min-height:34px;color:var(--key);font-size:1rem}
.keybtn.on{background:var(--key);color:#2A1700;border-color:var(--key)}
.keybtn.some{border-color:var(--key)}
.keybtn.big{min-width:42px}

.tl{flex:none;height:132px;background:var(--panel);border-top:1px solid var(--rule);position:relative;overflow:hidden}
.tl.closed{height:0;border:0}
.tl-scroll{position:absolute;inset:0;overflow-x:auto;overflow-y:auto;scrollbar-width:none;touch-action:pan-x pan-y}
.tl-scroll::-webkit-scrollbar{display:none}
.tl-inner{position:relative;min-height:100%}
.tl-ruler{position:sticky;top:0;height:20px;background:var(--panel);z-index:3;border-bottom:1px solid var(--rule)}
.tl-tick{position:absolute;top:0;height:20px;border-left:1px solid var(--rule);font:10px var(--f-mono);color:var(--muted);padding-left:3px}
.tl-end{position:absolute;top:0;bottom:0;width:2px;background:var(--rule)}
.tl-row{position:relative;height:26px;border-bottom:1px solid rgba(255,255,255,.04)}
.tl-row.sel{background:rgba(233,161,91,.07)}
.tl-row.chan{height:22px;background:rgba(0,0,0,.18)}
.tl-label{position:sticky;left:0;z-index:2;display:inline-flex;align-items:center;height:100%;max-width:150px;padding:0 8px;font-size:.75rem;background:linear-gradient(90deg,var(--panel) 75%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tl-row.chan .tl-label{font-size:.7rem;color:var(--muted);padding-left:18px}
.tl-span{position:absolute;top:9px;height:8px;background:rgba(242,179,94,.16);border-radius:4px}
.tl-key{position:absolute;top:6px;width:14px;height:14px;margin-left:-7px;background:var(--key);transform:rotate(45deg) scale(.78);border:1px solid #2A1700;border-radius:2px;touch-action:none;cursor:grab}
.tl-row.chan .tl-key{top:5px;width:12px;height:12px;margin-left:-6px;opacity:.8}
.tl-key.at{background:#fff}
.tl-ph{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--sel);z-index:4;pointer-events:none}
.tl-ph::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--sel)}

.tools{flex:none;display:flex;gap:4px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:var(--panel2);border-top:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;min-width:60px;border:1px solid transparent;background:transparent;border-radius:10px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tool .ti{font-size:1.15rem;line-height:1.3}
.tool .tlab{font-size:.68rem;color:var(--muted);white-space:nowrap}
.tool.active{background:var(--panel3);border-color:var(--accent)}
.tool.active .tlab{color:var(--ink)}
.tool:disabled{opacity:.35}
.tool.sep{min-width:1px;width:1px;padding:0;margin:4px 2px;background:var(--rule)}

.sheet{position:fixed;left:0;right:0;bottom:0;max-height:min(62vh,560px);background:var(--panel);border-top:1px solid var(--rule);border-radius:16px 16px 0 0;z-index:20;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;border-bottom:1px solid var(--rule);-webkit-user-select:none;user-select:none}
.sheet-head b{flex:1}
.sheet-body{overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){
  .sheet{top:var(--barh);bottom:0;left:auto;right:0;width:var(--sheetw);max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--rule)}
  body.docked .main{margin-right:var(--sheetw)}
}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h3{margin:0;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:.78rem;color:var(--muted)}
input[type=text],input[type=number],select{background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:7px 9px;min-height:38px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--rule);background:var(--panel2);border-radius:99px;padding:6px 12px;font-size:.85rem}
.pick.on{border-color:var(--accent);background:var(--panel3);color:var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{border:1px solid var(--rule);background:var(--panel2);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem}
.tile .ic{font-size:1.6rem;line-height:1}
.tile.on{border-color:var(--accent)}
.tile canvas{width:48px;height:48px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--rule)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.sw-custom{width:44px;height:32px;padding:0;border:1px solid var(--rule);border-radius:8px;background:none}
.stepper{display:flex;align-items:center;gap:4px}
.stepper input{text-align:center;font-family:var(--f-mono)}
.stepper button{min-width:38px;min-height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--panel2)}
.kfrow{display:grid;grid-template-columns:minmax(70px,1fr) minmax(120px,1.6fr) 40px;gap:8px;align-items:center}
.kfrow .fl{font-size:.8rem;color:var(--muted)}
.vec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vec input{text-align:center;font-family:var(--f-mono);padding:6px 4px}
.vec label{display:flex;flex-direction:column;gap:2px;font-size:.7rem;color:var(--muted);text-align:center}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--rule);border-radius:10px;padding:6px 8px}
.li.on{border-color:var(--accent)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li input[type=text]{min-height:32px;padding:4px 8px}
.chk{display:flex;align-items:center;gap:8px;font-size:.88rem}
.chk input{width:20px;height:20px;accent-color:var(--accent)}

dialog{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:14px;padding:16px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 10px;font-size:1.05rem}
dialog video{width:100%;border-radius:8px;background:#000}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{text-align:left;justify-content:flex-start}
.toast{position:fixed;left:50%;top:calc(var(--barh) + 56px);transform:translateX(-50%) translateY(10px);background:#000;border:1px solid var(--rule);border-radius:99px;padding:8px 16px;font-size:.85rem;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* stage mode */
body.staging .modes,body.staging .tools,body.staging .bar{display:none}
.stageui{position:absolute;inset:0;pointer-events:none}
.stageui>*{pointer-events:auto}
.st-top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st-top select{max-width:160px;min-height:38px}
.st-status{background:rgba(14,14,18,.7);border-radius:99px;padding:6px 12px;font:600 .85rem var(--f-mono)}
.st-status.rec{background:var(--rec);color:#fff}
.joy{position:absolute;bottom:14px;width:clamp(110px,26vmin,170px);height:clamp(110px,26vmin,170px);border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);touch-action:none}
.joy.l{left:14px}.joy.r{right:14px}
.joy .knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:rgba(233,161,91,.85);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.joy .jl{position:absolute;left:0;right:0;top:-20px;text-align:center;font-size:.7rem;color:var(--muted)}
.trig{position:absolute;bottom:calc(clamp(110px,26vmin,170px) + 34px);width:48px;height:clamp(90px,20vmin,140px);border-radius:12px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);touch-action:none;overflow:hidden}
.trig.l{left:14px}.trig.r{right:14px}
.trig .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(233,161,91,.75)}
.trig .jl{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:.65rem;color:#fff;z-index:1}
.stbtn{position:absolute;bottom:calc(clamp(110px,26vmin,170px) + 34px);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);font-weight:700;touch-action:none}
.stbtn.a{right:74px}
.stbtn.on{background:var(--accent);color:var(--accent-ink)}
.padinfo{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:.75rem;color:var(--muted);background:rgba(14,14,18,.6);border-radius:99px;padding:4px 10px;white-space:nowrap}
canvas.graph{width:100%;height:auto;aspect-ratio:2/1;border-radius:10px;border:1px solid var(--rule);touch-action:none;display:block}
.abxy{position:absolute;right:calc(clamp(110px,26vmin,170px) + 30px);bottom:18px;width:120px;height:120px;pointer-events:none}
.abxy .stbtn{position:absolute;width:44px;height:44px;bottom:auto;pointer-events:auto}
.abxy .y{left:38px;top:0}.abxy .x{left:0;top:38px}.abxy .b{right:0;top:38px;left:auto}.abxy .a{left:38px;top:76px;right:auto}
@media (max-width:640px){.abxy{right:50%;transform:translateX(50%);bottom:calc(clamp(110px,26vmin,170px) + 40px)}}
.facebox{position:absolute;right:8px;top:96px;width:150px;background:rgba(14,14,18,.75);border:1px solid var(--rule);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.facevid{width:100%;border-radius:8px;transform:scaleX(-1);background:#000;aspect-ratio:4/3;object-fit:cover}
.facestat{font-size:.72rem;color:var(--muted);line-height:1.3}

.navwrap{position:absolute;right:62px;top:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.navgizmo{width:84px;height:84px;touch-action:none;cursor:grab;border-radius:50%}
.navlabel{background:rgba(14,14,18,.6);border:1px solid var(--rule);border-radius:99px;padding:3px 10px;font-size:.72rem;color:var(--muted);min-height:26px;white-space:nowrap}
.pop{position:absolute;z-index:30;background:rgba(23,23,29,.97);border:1px solid var(--rule);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;width:min(290px,calc(100% - 16px));box-shadow:0 10px 30px rgba(0,0,0,.45);max-height:calc(100% - 16px);overflow:auto}
.pop .btn{min-height:34px;padding:4px 8px;font-size:.8rem}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pseg{display:flex;gap:4px}.pseg .btn{flex:1}
.pop .chk{font-size:.8rem}
.pop p{margin:0}
body.staging .navwrap,body.staging #lockBtn{display:none}

</style>
<header class="bar">
  <a class="brand" href="./" aria-label="Clayframe"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#17171D"/><defs><radialGradient id="g" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#F6C9A0"/><stop offset=".55" stop-color="#E8A87C"/><stop offset="1" stop-color="#8E4F2E"/></radialGradient></defs><ellipse cx="32" cy="50" rx="15" ry="3.5" fill="#000" opacity=".35"/><path d="M32 13c10 0 17 7 17 17 0 11-7 18-17 18s-17-6-17-17c0-10 7-18 17-18z" fill="url(#g)"/><circle cx="26.5" cy="27" r="2.6" fill="#2B2B33"/><circle cx="37.5" cy="27" r="2.6" fill="#2B2B33"/><path d="M26 35c3.5 3 8.5 3 12 0" stroke="#2B2B33" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M50 9l4 4-4 4-4-4z" fill="#F2B35E"/></svg><b>Clayframe</b></a>
  <select id="proj" aria-label="Project"></select>
  <button id="menuBtn" class="iconbtn" type="button" aria-label="Projects and settings">⋯</button>
  <span class="grow"></span>
  <button id="undo" class="iconbtn" type="button" aria-label="Undo" title="Undo">↶</button>
  <button id="redo" class="iconbtn" type="button" aria-label="Redo" title="Redo">↷</button>
  <button id="exportBtn" class="btn primary" type="button">Export</button>
</header>
<div id="main" class="main">
  <div id="viewWrap" class="viewwrap">
    <canvas id="view" aria-label="3D view"></canvas>
    <canvas id="ov" aria-hidden="true"></canvas>
    <div id="sliders" class="sliders" hidden>
      <label class="vs"><span>Size</span><input id="radius" type="range" min="8" max="200" value="50" aria-label="Brush size"></label>
      <label class="vs"><span>Strength</span><input id="strength" type="range" min="1" max="100" value="45" aria-label="Brush strength"></label>
    </div>
    <div id="viewBtns" class="viewbtns">
      <button id="symBtn" class="vbtn tog" type="button" aria-pressed="true" title="Mirror across X">⇋ X</button>
      <button id="subBtn" class="vbtn tog" type="button" aria-pressed="false" title="Invert the brush" hidden>− Sub</button>
      <button id="frameBtn" class="vbtn" type="button" title="Frame the selection">⌖</button>
      <button id="camViewBtn" class="vbtn tog" type="button" aria-pressed="false" title="Look through the shot camera">🎥</button>
      <button id="renderBtn" class="vbtn tog" type="button" aria-pressed="false" title="Render view: lights, shadows and a floor">☀</button>
      <button id="wireBtn" class="vbtn tog" type="button" aria-pressed="false" title="Show the wireframe">▦</button>
      <button id="lockBtn" class="vbtn tog" type="button" aria-pressed="false" title="Axis lock: move along one axis, or in steps">✥ Free</button>
    </div>
    <div id="navWrap" class="navwrap">
      <canvas id="navGizmo" class="navgizmo" role="img" aria-label="View gizmo: tap an axis to look along it, drag to turn the view"></canvas>
      <button id="navLabel" class="navlabel" type="button" title="View options">Persp ▾</button>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="stageUI" class="stageui" hidden></div>
  </div>
  <div class="modes" role="tablist" aria-label="Mode">
    <button type="button" role="tab" data-mode="sculpt">Sculpt</button>
    <button type="button" role="tab" data-mode="objects">Objects</button>
    <button type="button" role="tab" data-mode="rig">Rig</button>
    <button type="button" role="tab" data-mode="pose">Pose</button>
    <button type="button" role="tab" data-mode="stage">Stage</button>
  </div>
  <div class="transport">
    <button class="playbtn" type="button" aria-label="Play">▶</button>
    <span class="time"><span id="time">0.00</span><span class="muted"> / <span id="dur">0</span>s</span></span>
    <span class="grow"></span>

    const cyl = MESHLIB.PRIMS.cylinder.make(); cyl.col.fill(0); for (let i = 0; i < cyl.col.length; i += 3) cyl.col.set(hex(cyl.pos[i + 1] > 0.3 ? '#C9CBD1' : col), i);

  add('pens', MESHLIB.merge(pens), { name: 'Pens', parent: 'prof', parentBone: 'chest', color: '#FFFFFF', matcap: 'glossy' });

  // an Erlenmeyer flask of something green, held by the neck
  const fp = [frustum(-0.2, -0.07, [0.1, 0.1], [0.032, 0.032])];

  const FL = [0.875, 0.655, 0.115];
  add('flask', flask, { name: 'Flask', parent: 'prof', parentBone: 'handR', pos: FL, color: '#FFFFFF', matcap: 'glossy',
    // turned against the arm so it stays upright while he lifts it
    keys: { rot: [{ t: 0.6, v: [0, 0, 0] }, { t: 1.6, v: [125, 0, 0], ease: 'smooth' }, { t: 3.2, v: [125, 0, 0] }, { t: 4.2, v: [45, 0, 0] }, { t: 5.4, v: [0, 0, 0] }] } });
  // bubbles rising out of it, on a loop
  [[0, 0.004], [0.55, -0.006], [1.1, 0.008]].forEach(([d, x], k) => {
    const b = MESHLIB.icosphere(2);
    const o = { name: 'Bubble ' + (k + 1), parent: 'prof', parentBone: 'handR', pos: [FL[0] + x, FL[1] + 0.05, FL[2]], scl: [0.04, 0.04, 0.04], color: '#7CF09A', matcap: 'glossy', repeat: 'loop' };

  });

  // ---------- a little performance: inspect the flask, then "Eureka!" ----------
  const E = e => q.norm(q.fromEuler(e)).map(v => Math.round(v * 1e5) / 1e5);
  prof.keys = {
    'bone:chest': [{ t: 0, v: E([0, 0, 0]) }, { t: 1, v: E([3, 0, 0]) }, { t: 2.4, v: E([4, 8, 0]) }, { t: 3.4, v: E([-6, 0, 0]), ease: 'backOut' }, { t: 4.8, v: E([-4, 0, 0]) }, { t: 6, v: E([0, 0, 0]) }],
    'bone:head': [{ t: 0, v: E([0, 0, 0]) }, { t: 1.2, v: E([6, 10, 0]) }, { t: 2.2, v: E([10, 22, -10]) }, { t: 3.0, v: E([8, 18, 8]) }, { t: 3.4, v: E([-10, 0, 0]), ease: 'backOut' }, { t: 4.8, v: E([-6, -5, 4]) }, { t: 6, v: E([0, 0, 0]) }],
    'bone:armR': [{ t: 0, v: E([0, 0, 0]) }, { t: 0.6, v: E([0, 0, 0]) }, { t: 1.6, v: E([-62, 0, -10]), ease: 'smooth' }, { t: 3.2, v: E([-62, 0, -10]) }, { t: 4.2, v: E([-20, 0, 8]) }, { t: 5.4, v: E([0, 0, 0]) }],
    'bone:foreR': [{ t: 0, v: E([0, 0, 0]) }, { t: 0.6, v: E([0, 0, 0]) }, { t: 1.6, v: E([-75, 0, 0]), ease: 'smooth' }, { t: 2.4, v: E([-80, 25, 0]) }, { t: 3.0, v: E([-80, -15, 0]) }, { t: 3.2, v: E([-75, 0, 0]) }, { t: 4.2, v: E([-30, 0, 0]) }, { t: 5.4, v: E([0, 0, 0]) }],
    'bone:armL': [{ t: 0, v: E([0, 0, 0]) }, { t: 3.0, v: E([0, 0, 0]) }, { t: 3.5, v: E([-15, 0, -112]), ease: 'backOut' }, { t: 4.8, v: E([-15, 0, -108]) }, { t: 5.6, v: E([0, 0, 0]), ease: 'smooth' }],
    'bone:foreL': [{ t: 3.0, v: E([0, 0, 0]) }, { t: 3.5, v: E([0, 0, -35]), ease: 'backOut' }, { t: 4.8, v: E([0, 0, -40]) }, { t: 5.6, v: E([0, 0, 0]) }],
    'bone:hips': [{ t: 0, v: E([0, 0, 0]) }, { t: 3.3, v: E([0, 0, 0]) }, { t: 3.5, v: E([0, 0, 3]) }, { t: 4.8, v: E([0, 0, 2]) }, { t: 6, v: E([0, 0, 0]) }],
    'morph:brows': [{ t: 0, v: 0 }, { t: 2.2, v: 0.2 }, { t: 2.8, v: -0.4 }, { t: 3.2, v: -0.3 }, { t: 3.4, v: 1, ease: 'backOut' }, { t: 4.8, v: 0.9 }, { t: 5.6, v: 0 }],
    'morph:jaw': [{ t: 0, v: 0 }, { t: 3.2, v: 0 }, { t: 3.45, v: 0.9, ease: 'backOut' }, { t: 4.4, v: 0.75 }, { t: 4.9, v: 0 }],
    'morph:smile': [{ t: 0, v: 0.25 }, { t: 2.4, v: 0 }, { t: 3.4, v: 0.6 }, { t: 4.4, v: 1 }, { t: 6, v: 0.25 }]
  };
  // blinks
  for (const id of ['eyeR', 'eyeL']) {
    const o = objs.find(x => x.id === id), s0 = o.scl, sh = [s0[0], 0.012, s0[2]];
    o.keys = { scl: [{ t: 0.9, v: s0 }, { t: 1.0, v: sh }, { t: 1.1, v: s0 }, { t: 5.0, v: s0 }, { t: 5.1, v: sh }, { t: 5.2, v: s0 }] };
  }
  const sc = L.blankScene('Professor');
  sc.duration = 6; sc.objects = objs;
  sc.camKeys = [{ t: 0, v: { target: [0.1, 1.25, 0], yaw: 0.42, pitch: 0.1, dist: 5.4, fov: 40 } }, { t: 2.6, v: { target: [0.25, 1.75, 0.1], yaw: 0.2, pitch: 0.06, dist: 2.6, fov: 40 }, ease: 'smooth' }, { t: 3.6, v: { target: [0, 1.5, 0], yaw: -0.05, pitch: 0.08, dist: 4.4, fov: 40 }, ease: 'backOut' }, { t: 6, v: { target: [0.1, 1.25, 0], yaw: 0.42, pitch: 0.1, dist: 5.4, fov: 40 } }];
  sc.view = { target: [0, 1.2, 0], yaw: 0.45, pitch: 0.12, dist: 5.2, fov: 40 };
  return { scene: sc, meshes };
};

<script>
/* Clayframe starters: a clay head to sculpt, a sphere to start from scratch, and rigged puppets
   (biped, quadruped, hexapod, spider and octopus), each skinned and given a looping two-second cycle.
   Built from primitives, fused with Remesh and smoothed, the same way you would by hand. */
window.CStarters = function (L) {
  const { MESHLIB, SC, S, newObj, blankScene } = L, { v3, q, m4 } = window.CM;
  const T = (t, e, s) => m4.trs(t, q.fromEuler(e || [0, 0, 0]), s || [1, 1, 1]);
  const ICO2 = MESHLIB.icosphere(2), ICO3 = MESHLIB.icosphere(3);
  const ball = (parts, c, s) => parts.push({ m: ICO3, mat: T(c, [0, 0, 0], (Array.isArray(s) ? s : [s, s, s]).map(v => v * 2)) });
  // a tapered tube: overlapping balls along a line, fused by Remesh
  const tube = (parts, A, B, r0, r1) => {
    const n = Math.max(2, Math.ceil(v3.dist(A, B) / (Math.min(r0, r1) * 0.45)));
    for (let i = 0; i <= n; i++) { const u = i / n, r = r0 + (r1 - r0) * u; parts.push({ m: ICO2, mat: T(v3.lerp(A, B, u), [0, 0, 0], [r * 2, r * 2, r * 2]) }); }
  };
  const fuse = (parts, res, smooth) => { const r = MESHLIB.remesh(MESHLIB.merge(parts), res); const m = r ? r.m : MESHLIB.merge(parts); SC.smoothAll(m, smooth == null ? 2 : smooth); MESHLIB.normals(m); return m; };
  const E = e => q.norm(q.fromEuler(e)).map(v => Math.round(v * 1e5) / 1e5);
  const pack = (m, skin) => ({ pos: m.pos, idx: m.idx, col: m.col, mask: m.mask, morphs: {}, skin: skin || null });
  const bone = (id, name, parent, head, tail, mirror) => ({ id, name, parent, head, tail, mirror, rot: [0, 0, 0, 1] });
  // a looping cycle: f(phase 0..1) → euler degrees, sampled at 9 keys over the loop
  const cycle = (dur, f, steps = 8) => { const out = []; for (let i = 0; i <= steps; i++) out.push({ t: Math.round(dur * i / steps * 1000) / 1000, v: E(f((i % steps) / steps)) }); return out; };
  const S2 = x => Math.sin(x * Math.PI * 2);
  const eyes = (sc, meshes, parent, boneId, pts, size) => {
    const eye = MESHLIB.icosphere(3);

      const id = parent + 'Eye' + i;
      sc.objects.push(newObj({ id, name: 'Eye ' + (i % 2 ? 'L' : 'R') + (pts.length > 2 ? ' ' + (i + 1) : ''), parent, parentBone: boneId, pos: p, scl: size, color: '#24242B', matcap: 'glossy' }));

  const view = (sc, target, dist, yaw, pitch) => { sc.view = { target, yaw: yaw == null ? 0.6 : yaw, pitch: pitch == null ? 0.2 : pitch, dist, fov: 40 }; };

  /* ---------- a clay head, ready to sculpt ---------- */
  function head() {
    const sc = blankScene('Clay head'), meshes = {}, parts = [];
    ball(parts, [0, 1.0, 0], [0.36, 0.42, 0.38]);           // skull
    ball(parts, [0, 0.8, 0.07], [0.29, 0.24, 0.29]);         // jaw
    ball(parts, [0, 0.62, 0.12], [0.13, 0.08, 0.12]);        // chin
    ball(parts, [0, 0.93, 0.36], [0.06, 0.09, 0.07]);        // nose
    for (const sx of [1, -1]) { ball(parts, [0.36 * sx, 0.93, -0.02], [0.05, 0.1, 0.07]); ball(parts, [0.17 * sx, 0.83, 0.22], [0.1, 0.08, 0.08]); }
    tube(parts, [0, 0.7, -0.05], [0, 0.25, -0.05], 0.17, 0.2); // neck
    const m = fuse(parts, 130, 2);
    // a few strokes to start from: eye sockets and a brow
    const at = P => { const i = SC.nearest(m, P); return { i, P: [m.pos[i * 3], m.pos[i * 3 + 1], m.pos[i * 3 + 2]], N: [m.nor[i * 3], m.nor[i * 3 + 1], m.nor[i * 3 + 2]] }; };
    for (const sx of [1, -1]) {
      for (let k = 0; k < 3; k++) { const h = at([0.13 * sx, 1.0, 0.36]); SC.dab(m, { tool: 'clay', P: h.P, N: h.N, r: 0.09, s: 0.5, invert: true, seed: h.i }); }
      for (let k = 0; k < 4; k++) { const h = at([(0.06 + k * 0.05) * sx, 1.08, 0.36]); SC.dab(m, { tool: 'inflate', P: h.P, N: h.N, r: 0.06, s: 0.35, seed: h.i }); }
    }
    MESHLIB.normals(m);
    sc.objects.push(newObj({ id: 'head', name: 'Clay head', color: '#D8A88A', matcap: 'clay' }));
    meshes.head = pack(m);
    view(sc, [0, 0.9, 0], 3, 0.5, 0.1);
    return { scene: sc, meshes, mode: 'sculpt' };
  }
  function empty() {
    const sc = blankScene('Sculpt'), meshes = {}, m = MESHLIB.icosphere(5);
    for (let i = 0; i < m.pos.length; i += 3) m.pos[i + 1] += 1;
    MESHLIB.normals(m);
    sc.objects.push(newObj({ id: 'clay', name: 'Clay', color: '#D9D4CF', matcap: 'clay' }));
    meshes.clay = pack(m);
    view(sc, [0, 1, 0], 3.2, 0.4, 0.15);
    return { scene: sc, meshes, mode: 'sculpt' };
  }

  /* ---------- puppets ---------- */
  const D = 2; // every cycle loops in two seconds
  function biped() {
    const sc = blankScene('Biped puppet'), meshes = {}, parts = [];
    sc.duration = D;
    ball(parts, [0, 1.05, 0], [0.33, 0.4, 0.26]);              // body
    ball(parts, [0, 1.75, 0.02], [0.3, 0.3, 0.28]);            // head
    for (const sx of [1, -1]) {
      tube(parts, [0.34 * sx, 1.32, 0], [0.48 * sx, 0.98, 0], 0.09, 0.08);
      tube(parts, [0.48 * sx, 0.98, 0], [0.55 * sx, 0.66, 0.04], 0.08, 0.075);
      tube(parts, [0.16 * sx, 0.72, 0], [0.17 * sx, 0.38, 0.02], 0.12, 0.1);
      tube(parts, [0.17 * sx, 0.38, 0.02], [0.17 * sx, 0.07, 0], 0.1, 0.09);
      ball(parts, [0.17 * sx, 0.05, 0.07], [0.1, 0.06, 0.15]); // foot
    }
    const m = fuse(parts, 110);
    const o = newObj({ id: 'biped', name: 'Biped', color: '#E8A87C', matcap: 'clay' });
    o.bones = [bone('hips', 'Hips', null, [0, 0.75, 0], [0, 1.15, 0]), bone('chest', 'Chest', 'hips', [0, 1.15, 0], [0, 1.45, 0]), bone('head', 'Head', 'chest', [0, 1.45, 0], [0, 2.05, 0])];
    for (const [s, sx, mr] of [['R', 1, 'L'], ['L', -1, 'R']]) {
      o.bones.push(bone('arm' + s, 'Arm ' + s, 'chest', [0.34 * sx, 1.32, 0], [0.48 * sx, 0.98, 0], 'arm' + mr), bone('fore' + s, 'Forearm ' + s, 'arm' + s, [0.48 * sx, 0.98, 0], [0.55 * sx, 0.66, 0.04], 'fore' + mr),
        bone('thigh' + s, 'Thigh ' + s, 'hips', [0.16 * sx, 0.72, 0], [0.17 * sx, 0.38, 0.02], 'thigh' + mr), bone('shin' + s, 'Shin ' + s, 'thigh' + s, [0.17 * sx, 0.38, 0.02], [0.17 * sx, 0.04, 0.05], 'shin' + mr));
    }
    meshes.biped = pack(m, S.autoWeights(m, o.bones));
    // walk: legs swing opposite, knees bend on the way through, arms counter-swing, a little bob and sway
    const ph = { R: 0, L: 0.5 };
    o.keys = { pos: [0, 0.25, 0.5, 0.75, 1].map(u => ({ t: u * D, v: [0, Math.round(Math.abs(Math.cos(u * Math.PI * 2)) * 0.05 * 1000) / 1000, 0] })), 'bone:chest': cycle(D, u => [3, 6 * S2(u), 0]), 'bone:head': cycle(D, u => [-2, -5 * S2(u), 0]) };
    for (const s of ['R', 'L']) {
      o.keys['bone:thigh' + s] = cycle(D, u => [-28 * Math.cos((u + ph[s]) * Math.PI * 2), 0, 0]);
      o.keys['bone:shin' + s] = cycle(D, u => [Math.max(0, 40 * Math.sin((u + ph[s]) * Math.PI * 2)), 0, 0]);
      o.keys['bone:arm' + s] = cycle(D, u => [24 * Math.cos((u + ph[s]) * Math.PI * 2), 0, 0]);
      o.keys['bone:fore' + s] = cycle(D, u => [-15 - 10 * Math.cos((u + ph[s]) * Math.PI * 2), 0, 0]);
    }
    sc.objects.push(o);
    eyes(sc, meshes, 'biped', 'head', [[0.11, 1.8, 0.27], [-0.11, 1.8, 0.27]], [0.09, 0.12, 0.07]);
    view(sc, [0, 1, 0], 5, 0.7, 0.12);
    return { scene: sc, meshes, mode: 'pose' };
  }
  function quadruped() {
    const sc = blankScene('Quadruped puppet'), meshes = {}, parts = [];
    sc.duration = D;
    tube(parts, [0, 0.9, -0.55], [0, 0.95, 0.5], 0.3, 0.32);  // body
    tube(parts, [0, 1.05, 0.62], [0, 1.35, 0.85], 0.17, 0.15); // neck
    ball(parts, [0, 1.42, 0.98], [0.2, 0.19, 0.24]);           // head
    ball(parts, [0, 1.36, 1.2], [0.1, 0.09, 0.11]);            // snout
    for (const sx of [1, -1]) ball(parts, [0.13 * sx, 1.6, 0.92], [0.05, 0.11, 0.05]); // ears
    tube(parts, [0, 1.0, -0.78], [0, 1.25, -1.15], 0.07, 0.04); // tail
    const legs = [['FR', 0.2, 0.42], ['FL', -0.2, 0.42], ['BR', 0.2, -0.45], ['BL', -0.2, -0.45]];
    for (const [, x, z] of legs) { tube(parts, [x, 0.75, z], [x, 0.4, z + 0.02], 0.11, 0.09); tube(parts, [x, 0.4, z + 0.02], [x, 0.05, z + 0.04], 0.09, 0.08); }
    const m = fuse(parts, 110);
    const o = newObj({ id: 'quad', name: 'Quadruped', color: '#C9A27A', matcap: 'clay' });
    o.bones = [bone('spine', 'Spine', null, [0, 0.9, -0.55], [0, 0.95, 0.5]), bone('neck', 'Neck', 'spine', [0, 1.05, 0.6], [0, 1.35, 0.85]), bone('head', 'Head', 'neck', [0, 1.35, 0.85], [0, 1.4, 1.25]), bone('tail', 'Tail', 'spine', [0, 1.0, -0.75], [0, 1.25, -1.15])];
    for (const [k, x, z] of legs) { const mr = k[0] + (k[1] === 'R' ? 'L' : 'R'); o.bones.push(bone('up' + k, 'Leg ' + k, 'spine', [x, 0.78, z], [x, 0.4, z + 0.02], 'up' + mr), bone('lo' + k, 'Foot ' + k, 'up' + k, [x, 0.4, z + 0.02], [x, 0.03, z + 0.04], 'lo' + mr)); }
    meshes.quad = pack(m, S.autoWeights(m, o.bones));
    const ph = { FR: 0, BL: 0, FL: 0.5, BR: 0.5 }; // diagonal pairs move together (a trot)
    o.keys = { pos: [0, 0.25, 0.5, 0.75, 1].map(u => ({ t: u * D, v: [0, Math.round(Math.abs(Math.sin(u * Math.PI * 2)) * 0.04 * 1000) / 1000, 0] })), 'bone:tail': cycle(D, u => [10, 0, 25 * S2(u * 2)]), 'bone:head': cycle(D, u => [6 * S2(u * 2), 0, 0]) };
    for (const [k] of legs) {
      o.keys['bone:up' + k] = cycle(D, u => [-26 * Math.cos((u + ph[k]) * Math.PI * 4), 0, 0]);
      o.keys['bone:lo' + k] = cycle(D, u => [(k[0] === 'F' ? -1 : 1) * Math.max(0, 34 * Math.sin((u + ph[k]) * Math.PI * 4)), 0, 0]);
    }
    sc.objects.push(o);
    eyes(sc, meshes, 'quad', 'head', [[0.1, 1.48, 1.17], [-0.1, 1.48, 1.17]], [0.07, 0.08, 0.06]);
    view(sc, [0, 0.9, 0.2], 5, 1.0, 0.18);
    return { scene: sc, meshes, mode: 'pose' };
  }
  // insects and spiders: legs from the body's sides, two joints each, stepping in a wave or tripod gait
  function crawler(kind) {
    const spider = kind === 'octopod', n = spider ? 4 : 3;
    const sc = blankScene(spider ? 'Spider puppet' : 'Hexapod puppet'), meshes = {}, parts = [];
    sc.duration = D;
    const Y = 0.55;
    if (spider) { ball(parts, [0, Y, 0.15], [0.3, 0.2, 0.3]); ball(parts, [0, Y + 0.12, -0.5], [0.4, 0.33, 0.45]); }
    else { ball(parts, [0, Y, 0.05], [0.2, 0.16, 0.26]); ball(parts, [0, Y + 0.04, -0.5], [0.27, 0.22, 0.36]); ball(parts, [0, Y + 0.06, 0.45], [0.18, 0.16, 0.18]); for (const sx of [1, -1]) tube(parts, [0.08 * sx, Y + 0.18, 0.56], [0.22 * sx, Y + 0.5, 0.78], 0.025, 0.02); }
    const legs = [];
    for (let i = 0; i < n; i++) for (const sx of [1, -1]) {
      const z = spider ? 0.4 - i * 0.18 : 0.25 - i * 0.22, spread = spider ? [0.55, 0.3, -0.05, -0.35][i] : [0.35, 0, -0.3][i];
      const hip = [0.15 * sx, Y, z], knee = [(spider ? 0.75 : 0.55) * sx, Y + (spider ? 0.45 : 0.25), z + spread * 0.6], foot = [(spider ? 1.15 : 0.8) * sx, 0.02, z + spread];
      const id = (sx > 0 ? 'R' : 'L') + (i + 1);
      tube(parts, hip, knee, spider ? 0.06 : 0.05, spider ? 0.05 : 0.04); tube(parts, knee, foot, spider ? 0.05 : 0.04, 0.025);
      legs.push({ id, sx, i, hip, knee, foot });
    }
    const m = fuse(parts, 120, 1);
    const o = newObj({ id: kind, name: spider ? 'Spider' : 'Hexapod', color: spider ? '#5A4636' : '#8A5A3B', matcap: 'clay' });
    o.bones = [bone('body', 'Body', null, [0, Y, -0.6], [0, Y, 0.3]), bone('head', 'Head', 'body', [0, Y, 0.3], [0, Y + 0.05, spider ? 0.45 : 0.62])];
    for (const g of legs) { const mr = (g.sx > 0 ? 'L' : 'R') + (g.i + 1); o.bones.push(bone('up' + g.id, 'Leg ' + g.id, 'body', g.hip, g.knee, 'up' + mr), bone('lo' + g.id, 'Foot ' + g.id, 'up' + g.id, g.knee, g.foot, 'lo' + mr)); }
    meshes[kind] = pack(m, S.autoWeights(m, o.bones));

  // ---------- mirror and flip poses ----------
  const mirQ = qq => [qq[0], -qq[1], -qq[2], qq[3]];

  // ---------- cycles: walk and idle made from the bones, and looping ----------
  function classifyBones(o) {
    const B = o.bones, by = new Map(B.map(b => [b.id, b]));
    const side = b => Math.sign((b.head[0] + b.tail[0]) / 2) || 0;
    const centre = b => Math.abs(b.head[0]) < 0.06 && Math.abs(b.tail[0]) < 0.06;
    const down = b => b.tail[1] < b.head[1] - 0.6 * Math.abs(b.tail[0] - b.head[0]) && b.tail[1] < b.head[1] - 0.05;
    const flat = b => Math.abs(b.tail[0] - b.head[0]) > Math.abs(b.tail[1] - b.head[1]);
    const isLeg = b => !centre(b) && down(b), isArm = b => !centre(b) && flat(b);
    const legs = B.filter(b => isLeg(b) && !(b.parent && by.has(b.parent) && isLeg(by.get(b.parent))));
    const shins = B.filter(b => isLeg(b) && b.parent && by.has(b.parent) && isLeg(by.get(b.parent)));
    const arms = B.filter(b => isArm(b) && !(b.parent && by.get(b.parent) && isArm(by.get(b.parent))));
    const fore = B.filter(b => isArm(b) && b.parent && by.get(b.parent) && isArm(by.get(b.parent)));
    const spine = B.filter(centre).sort((a, b) => a.head[1] - b.head[1]);

  const E = e => q.norm(q.fromEuler(e)).map(v => round(v, 5));
  function walkPose(c, ph, amp) {

    for (const b of c.legs) { const s = c.side(b), a = Math.sin(ph + (s > 0 ? 0 : Math.PI)); P.set(b.id, E([-28 * a * amp, 0, 0])); }
    for (const b of c.shins) { const s = c.side(b), k = Math.max(0, Math.sin(ph + (s > 0 ? 0 : Math.PI) - Math.PI / 2)); P.set(b.id, E([40 * k * amp, 0, 0])); }

  function makeCycle(o, kind) {
    const c = classifyBones(o), t0 = round(time, 3), P = kind === 'walk' ? 1 : 2.4;

  function cyclesSheet(body, o) {

  // ---------- curves: keyframe values on a graph ----------
  let graphCh = null, graphKey = null;
  const COMP = ['#F2685B', '#7BD389', '#5B9BFF'];
  function chanVals(o, ch, v) { if (ch.startsWith('bone:')) return q.toEuler(v); if (typeof v === 'number') return [v]; return v.slice(); }
  function fromVals(o, ch, vals, old) { if (ch.startsWith('bone:')) return q.norm(q.fromEuler(vals)).map(x => round(x, 5)); if (typeof old === 'number') return round(vals[0], 4); return vals.map(x => round(x, 4)); }
  function graphSheet(body, o) {
    const chans = chanList(o).filter(([ch]) => (o.keys[ch] || []).length);
    if (!chans.length) { body.append(h('p', { class: 'muted' }, 'No keyframes on ' + o.name + ' yet.')); return; }
    if (!graphCh || !chans.some(c => c[0] === graphCh)) graphCh = chans[0][0];
    body.append(h('div', { class: 'chips' }, chans.map(([ch, l]) => h('button', { type: 'button', class: 'pick' + (ch === graphCh ? ' on' : ''), onclick: () => { graphCh = ch; graphKey = null; refreshSheet(); } }, l))));
    const cv = h('canvas', { class: 'graph', width: 720, height: 360, 'aria-label': 'Keyframe curves: drag a dot to change its time and value' });
    body.append(cv);
    const ks = o.keys[graphCh], D = scene.duration;
    let lo = Infinity, hi = -Infinity;
    const sample = t => chanVals(o, graphCh, getChan(o, graphCh, t));
    for (let i = 0; i <= 120; i++) for (const v of sample(i / 120 * D)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    for (const k of ks) for (const v of chanVals(o, graphCh, k.v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    if (hi - lo < 1e-3) { hi += 1; lo -= 1; }
    const padv = (hi - lo) * 0.15; lo -= padv; hi += padv;

    const X = t => L0 + t / D * (Wc - L0 - R0), Y = v => T0 + (hi - v) / (hi - lo) * (Hc - T0 - B0);

      for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; x.beginPath(); x.moveTo(L0, Y(v)); x.lineTo(Wc - R0, Y(v)); x.stroke(); x.fillText(String(round(v, 2)), 2, Y(v) + 4); }
      x.strokeStyle = '#5BC0FF'; x.beginPath(); x.moveTo(X(time), T0); x.lineTo(X(time), Hc - B0); x.stroke();
      const n = chanVals(o, graphCh, ks[0].v).length;
      for (let c = 0; c < n; c++) {
        x.strokeStyle = n === 1 ? '#F2B35E' : COMP[c]; x.lineWidth = 2; x.beginPath();
        for (let i = 0; i <= 240; i++) { const t = i / 240 * D, v = sample(t)[c]; i ? x.lineTo(X(t), Y(v)) : x.moveTo(X(t), Y(v)); }
        x.stroke();
        for (const k of ks) { const v = chanVals(o, graphCh, k.v)[c]; x.fillStyle = k === graphKey ? '#fff' : (n === 1 ? '#F2B35E' : COMP[c]); x.beginPath(); x.arc(X(k.t), Y(v), k === graphKey ? 8 : 6, 0, 7); x.fill(); }
      }

    let drag = null;
    const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * Wc / r.width, (e.clientY - r.top) * Hc / r.height]; };
    cv.addEventListener('pointerdown', e => {
      const [mx, my] = pos(e); let best = null;
      for (const k of ks) chanVals(o, graphCh, k.v).forEach((v, c) => { const d = Math.hypot(X(k.t) - mx, Y(v) - my); if (d < 22 && (!best || d < best.d)) best = { k, c, d }; });
      if (!best) return;
      e.preventDefault(); cv.setPointerCapture(e.pointerId);

      const k = drag.k, vals = chanVals(o, graphCh, k.v);

      dirty = true; paint();
    });
    const up = () => { if (!drag) return; const d = drag; drag = null; if (!d.moved) setTime(d.k.t); changed(); renderTimeline(); refreshSheet(); };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    if (graphKey && ks.includes(graphKey)) body.append(field('Easing into the ' + graphKey.t.toFixed(2) + 's keyframe', h('div', { class: 'chips' }, EASES.map(([k, l]) => h('button', { type: 'button', class: 'pick' + ((graphKey.ease || 'smooth') === k ? ' on' : ''), onclick: () => { before(); graphKey.ease = k; changed(); refreshSheet(); } }, l)))));
    body.append(h('p', { class: 'muted small' }, 'Drag a dot up or down to change its value, sideways to retime it. Tap one to jump there and set its easing.' + (graphCh.startsWith('bone:') ? ' Bone turns show as X, Y and Z angles.' : '')));
  }

  // ---------- timeline (fixed playhead in the middle; scroll to scrub) ----------
  let pps = 90, tlScroll = null, ignoreScroll = false, rtT = 0;
  const renderTimelineSoon = () => { clearTimeout(rtT); rtT = setTimeout(renderTimeline, 120); };
  function renderTimeline() {
    const tl = $('timeline');
    tl.classList.toggle('closed', !tlOpen);
    if (!scene) return;
    const prevTop = tlScroll ? tlScroll.scrollTop : 0;
    tl.innerHTML = '';
    const sc = h('div', { class: 'tl-scroll' }), half = Math.max(60, (tl.clientWidth || 360) / 2), D = scene.duration;
    const inner = h('div', { class: 'tl-inner', style: 'width:' + (half * 2 + D * pps) + 'px' });
    const X = t => half + t * pps;
    const ruler = h('div', { class: 'tl-ruler' });
    const step = pps > 140 ? 0.5 : pps > 40 ? 1 : 2;
    for (let t = 0; t <= D + 1e-6; t += step) ruler.append(h('div', { class: 'tl-tick', style: 'left:' + X(t) + 'px' }, Number.isInteger(t) ? t + 's' : ''));
    inner.append(ruler, h('div', { class: 'tl-end', style: 'left:' + X(D) + 'px' }));
    const diamond = (row, ch, t) => h('div', { class: 'tl-key' + (Math.abs(t - time) < 1e-3 ? ' at' : ''), style: 'left:' + X(t) + 'px', 'data-row': row, 'data-ch': ch || '', 'data-t': t });
    const span = (ts) => ts.length > 1 ? h('div', { class: 'tl-span', style: 'left:' + X(ts[0]) + 'px;width:' + (ts[ts.length - 1] - ts[0]) * pps + 'px' }) : null;
    if (scene.camKeys.length) {
      const ts = scene.camKeys.map(k => k.t);
      inner.append(h('div', { class: 'tl-row', 'data-sel': '' }, h('span', { class: 'tl-label' }, '🎥 Camera'), span(ts), ...ts.map(t => diamond('cam', '', t))));
    }
    const depth = o => { let d = 0, p = o; while (p && p.parent && d < 10) { p = objById(p.parent); d++; } return d; };
    for (const o of scene.objects) {
      const ts = S.keyTimes(o);
      inner.append(h('div', { class: 'tl-row' + (o.id === sel ? ' sel' : ''), 'data-sel': o.id }, h('span', { class: 'tl-label', style: 'padding-left:' + (8 + depth(o) * 10) + 'px' }, (o.visible === false ? '◌ ' : '') + o.name), span(ts), ...ts.map(t => diamond(o.id, '', t))));
      if (o.id === sel) for (const [ch, label] of chanList(o)) {
        const k = o.keys[ch]; if (!k || !k.length) continue;
        inner.append(h('div', { class: 'tl-row chan', 'data-sel': o.id }, h('span', { class: 'tl-label' }, label), ...k.map(x => diamond(o.id, ch, x.t))));
      }
    }
    if (!scene.objects.length) inner.append(h('div', { class: 'tl-row' }, h('span', { class: 'tl-label' }, 'Add something in Objects → Add')));
    sc.append(inner);
    tl.append(sc, h('div', { class: 'tl-ph' }));
    tlScroll = sc;
    ignoreScroll = true; sc.scrollLeft = time * pps; sc.scrollTop = prevTop;
    requestAnimationFrame(() => { ignoreScroll = false; });
    sc.addEventListener('scroll', () => { if (ignoreScroll || playing) return; setTime(sc.scrollLeft / pps, true); });
    sc.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); pps = clamp(pps * Math.exp(-e.deltaY * 0.004), 20, 400); renderTimeline(); }, { passive: false });
    sc.addEventListener('click', e => { if (e.target.closest('.tl-key')) return; const r = e.target.closest('.tl-row'); if (r && r.dataset.sel && r.dataset.sel !== sel) selectObj(r.dataset.sel); });
    sc.addEventListener('pointerdown', keyDown);
  }
  // drag a keyframe sideways to retime it; tap one to jump there (tap again for its easing)
  function keyDown(e) {
    const k = e.target.closest('.tl-key'); if (!k) return;
    e.preventDefault();
    const row = k.dataset.row, ch = k.dataset.ch, t0 = +k.dataset.t, x0 = e.clientX;
    let moved = false, snapDone = false;
    const move = ev => {
      const dt = (ev.clientX - x0) / pps;

    };

      tk.active ? h('span', { class: 'muted small' }, 'in use') : h('button', { type: 'button', class: 'btn primary', onclick: () => {
        before();
        for (const [ch, ks] of Object.entries(tk.chans)) { const keep = (o.keys[ch] || []).filter(k => k.t < tk.t0 - 1e-3 || k.t > tk.t1 + 1e-3); o.keys[ch] = keep.concat(ks.map(k => Object.assign({}, k))).sort((a, b) => a.t - b.t); }
        T.forEach(x => { if (x !== tk && Object.keys(x.chans).some(ch => tk.chans[ch])) x.active = false; }); tk.active = true;
        changed(); renderTimeline(); refreshSheet(); toast('Using ' + tk.name);
      } }, 'Use'),
      h('button', { type: 'button', class: 'iconbtn', 'aria-label': 'Forget ' + tk.name, onclick: () => { o.takes = T.filter(x => x !== tk); saveSoon(); refreshSheet(); } }, '✕'))));
    body.append(list);
  }

  // ---------- projects, backups, import ----------
  const b64 = a => { const u = new Uint8Array(a.buffer, a.byteOffset, a.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s, T) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
  function backupBlob() {
    const meshes = {};
    for (const [id, M] of MESH) meshes[id] = { pos: b64(M.m.pos), idx: b64(M.m.idx), col: b64(M.m.col), mask: b64(M.m.mask), morphs: Object.fromEntries(Object.entries(M.morphs).map(([k, v]) => [k, b64(v)])), skin: M.skin ? { bi: b64(M.skin.bi), bw: b64(M.skin.bw), bones: M.skin.bones } : null };
    return new Blob([JSON.stringify({ clayframe: 1, scene, meshes })], { type: 'application/json' });
  }
  function fromBackup(j) {
    const meshes = {};
    for (const [id, d] of Object.entries(j.meshes || {})) meshes[id] = { pos: unb64(d.pos, Float32Array), idx: unb64(d.idx, Uint32Array), col: unb64(d.col, Float32Array), mask: unb64(d.mask, Float32Array), morphs: Object.fromEntries(Object.entries(d.morphs || {}).map(([k, v]) => [k, unb64(v, Float32Array)])), skin: d.skin ? { bi: unb64(d.skin.bi, Float32Array), bw: unb64(d.skin.bw, Float32Array), bones: d.skin.bones } : null };
    return meshes;
  }
  function pickFile(accept) { return new Promise(res => {
    // iPadOS greys out file types it doesn't know (.obj, .pdb …), so for those the picker shows every file and the importer checks the contents
    const loose = /\.(obj|pdb|ent|cif|mmcif|glb|gltf|stl|csv|tsv)\b/i.test(accept || '');
    const i = h('input', loose ? { type: 'file', style: 'position:fixed;left:-9999px' } : { type: 'file', accept, style: 'position:fixed;left:-9999px' });
    i.addEventListener('change', () => { res(i.files[0] || null); i.remove(); }); document.body.append(i); i.click(); }); }
  async function importOBJ() {
    const f = await pickFile('.obj,text/plain'); if (!f) return;
    try {
      const m = MESHLIB.fromOBJ(await f.text());
      before();
      const b = MESHLIB.bounds(m);
      const o = addMesh(m, { name: f.name.replace(/\.[^.]+$/, '').slice(0, 30) || 'Import', pos: [0, round(-b.min[1] * 1.5, 3), 0], scl: [1.5, 1.5, 1.5] });
      sel = o.id; changed(); renderTools(); renderTimeline(); closeSheet();
      toast('Imported ' + (m.idx.length / 3).toLocaleString() + ' triangles');
    } catch (e) { toast('Couldn’t read that OBJ: ' + e.message); }
  }
  async function newProjectFrom(sc, meshes) {
    if (scene) await saveNow();
    const id = uid();
    openScene(sc, meshes, id);
    await saveNow(); fillProjects();
    return id;
  }
  function blankScene(name) { return { v: 1, name: name || 'Untitled', duration: 5, fps: 30, aspect: '16:9', bg: '#24242A', objects: [], camKeys: [] }; }
  function openMenu() {
    const d = $('dlg'); d.innerHTML = '';
    const act = (label, fn, cls) => h('button', { type: 'button', class: 'btn ' + (cls || 'quiet'), onclick: () => { d.close(); fn(); } }, label);
    const projs = listMeta();
    d.append(h('h2', {}, 'Projects'), h('div', { class: 'menu' },
      act('＋ New empty project', () => { newProjectFrom(blankScene('Project ' + (projs.length + 1)), {}); setMode('objects'); }),
      act('＋ New copy of the demo character', () => { const dm = demo(); newProjectFrom(dm.scene, dm.meshes); }),
      act('＋ New copy of the Professor (a sculpted scientist)', () => { toast('Sculpting the Professor…', 6000); setTimeout(async () => { const d = scientist(); await newProjectFrom(d.scene, d.meshes); setMode('objects'); toast('Meet the Professor. Press ▶, or try him in Stage with 🙂 Face.', 4000); }, 60); }),
      ...STARTERS.map(([k, label]) => act('＋ ' + label, () => newFromStarter(k))),
      act('⤓ Save a backup file', () => download(slug() + '.clayframe.json', backupBlob())),
      act('⤒ Open a backup file…', async () => { const f = await pickFile('.json,application/json'); if (!f) return; try { const j = JSON.parse(await f.text()); if (!j.clayframe) throw new Error('that isn’t a Clayframe backup'); newProjectFrom(j.scene, fromBackup(j)); toast('Opened ' + j.scene.name); } catch (e) { toast('Couldn’t open it: ' + e.message); } }),
      act('⌂ Scene settings', () => { if (mode === 'stage') setMode('objects'); openSheet('scene'); }),
      projs.length > 1 ? act('🗑 Delete this project', async () => { if (!await ask('Delete “' + scene.name + '”? This can’t be undone.', 'Delete')) return; const id = projId; try { await db.del(id); } catch (e) {} store.set('clayframe.projects', listMeta().filter(p => p.id !== id)); const next = listMeta()[0]; scene = null; if (!next || !(await loadProject(next.id))) { const dm = demo(); newProjectFrom(dm.scene, dm.meshes); } }, 'quiet danger') : null,
      h('p', { class: 'muted small' }, 'Projects are kept in this browser on this device. Save a backup file to move one to another device.'),
      act('Close', () => {})));
    d.showModal();
  }
  $('menuBtn').addEventListener('click', openMenu);
  $('proj').addEventListener('change', async e => { const id = e.target.value; await saveNow(); if (!(await loadProject(id))) { toast('Couldn’t open that project'); fillProjects(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

  function scientist() { return window.CScientist({ MESHLIB, SC, S, newObj, blankScene }); }
  // starting points shared by the ⋯ menu and Biostage: clay head, sphere, demo, the Professor and the puppets
  function starter(kind) {
    if (kind === 'demo') { const d = demo(); return { scene: d.scene, meshes: d.meshes, mode: 'pose' }; }
    if (kind === 'professor') { const d = scientist(); return { scene: d.scene, meshes: d.meshes, mode: 'objects' }; }
    return window.CStarters ? window.CStarters({ MESHLIB, SC, S, newObj, blankScene }).make(kind) : null;
  }
  const STARTERS = [['head', '◕ Clay head to sculpt'], ['biped', '🚶 Biped puppet (walk cycle)'], ['quadruped', '🐕 Quadruped puppet (trot)'], ['hexapod', '🐜 Hexapod puppet (tripod gait)'], ['octopod', '🕷 Spider puppet (wave gait)'], ['octopus', '🐙 Octopus puppet (swim)']];
  async function newFromStarter(kind) {
    toast('Building…', 5000);
    await new Promise(r => setTimeout(r, 60));
    const st = starter(kind); if (!st) return false;
    await newProjectFrom(st.scene, st.meshes);
    setMode(st.mode || 'objects');
    return true;
  }
  // ---------- the demo: a little rigged clay buddy and a ball ----------
  function demo() {
    const sc = blankScene('Clay buddy');
    sc.duration = 6;
    const meshes = {};
    const T = (t, e, s) => m4.trs(t, q.fromEuler(e || [0, 0, 0]), s || [1, 1, 1]);
    const ico = MESHLIB.icosphere(4), cap = MESHLIB.PRIMS.capsule.make();
    const body = MESHLIB.merge([
      { m: ico, mat: T([0, 1.0, 0], [0, 0, 0], [1.05, 1.2, 0.9]) },
      { m: ico, mat: T([0, 1.95, 0.02], [0, 0, 0], [0.86, 0.8, 0.8]) },
      { m: cap, mat: T([0.78, 1.18, 0], [0, 0, 72], [0.62, 1.05, 0.62]) },
      { m: cap, mat: T([-0.78, 1.18, 0], [0, 0, -72], [0.62, 1.05, 0.62]) },
      { m: cap, mat: T([0.26, 0.32, 0], [0, 0, 0], [0.72, 0.9, 0.72]) },
      { m: cap, mat: T([-0.26, 0.32, 0], [0, 0, 0], [0.72, 0.9, 0.72]) }]);
    // a smoothing pass blends the parts a little
    SC.smoothAll(body, 1); MESHLIB.normals(body);
    const o = newObj({ id: 'buddy', name: 'Buddy', color: '#E8A87C', matcap: 'clay' });
    o.bones = [
      { id: 'hips', name: 'Hips', parent: null, head: [0, 0.62, 0], tail: [0, 1.2, 0] },
      { id: 'chest', name: 'Chest', parent: 'hips', head: [0, 1.2, 0], tail: [0, 1.6, 0] },
      { id: 'head', name: 'Head', parent: 'chest', head: [0, 1.6, 0], tail: [0, 2.3, 0] },
      { id: 'armR', name: 'Arm R', parent: 'chest', head: [0.42, 1.36, 0], tail: [0.86, 1.2, 0], mirror: 'armL' },
      { id: 'handR', name: 'Hand R', parent: 'armR', head: [0.86, 1.2, 0], tail: [1.3, 1.04, 0], mirror: 'handL' },
      { id: 'armL', name: 'Arm L', parent: 'chest', head: [-0.42, 1.36, 0], tail: [-0.86, 1.2, 0], mirror: 'armR' },
      { id: 'handL', name: 'Hand L', parent: 'armL', head: [-0.86, 1.2, 0], tail: [-1.3, 1.04, 0], mirror: 'handR' },
      { id: 'legR', name: 'Leg R', parent: 'hips', head: [0.26, 0.62, 0], tail: [0.26, -0.05, 0], mirror: 'legL' },
      { id: 'legL', name: 'Leg L', parent: 'hips', head: [-0.26, 0.62, 0], tail: [-0.26, -0.05, 0], mirror: 'legR' }];
    o.bones.forEach(b => { b.rot = [0, 0, 0, 1]; });
    // shapes: a big surprised head, and a squash
    const n = body.pos.length;
    const big = new Float32Array(n), squash = new Float32Array(n);
    for (let i = 0; i < n; i += 3) {
      const x = body.pos[i], y = body.pos[i + 1], z = body.pos[i + 2];
      if (y > 1.55) { const k = Math.min(1, (y - 1.55) / 0.2); big[i] = x * 0.28 * k; big[i + 1] = (y - 1.95) * 0.28 * k; big[i + 2] = (z - 0.02) * 0.28 * k; }
      squash[i] = x * 0.22; squash[i + 1] = -y * 0.18; squash[i + 2] = z * 0.22;
    }
    o.morphs = [{ id: 'big', name: 'Surprise', w: 0 }, { id: 'squash', name: 'Squash', w: 0 }];
    meshes.buddy = { pos: body.pos, idx: body.idx, col: body.col, mask: body.mask, morphs: { big, squash }, skin: S.autoWeights(body, o.bones) };
    const E = e => q.norm(q.fromEuler(e)).map(v => round(v, 5));
    o.keys = {
      'bone:armR': [{ t: 0, v: E([0, 0, 0]) }, { t: 0.8, v: E([0, 0, 62]) }, { t: 3.6, v: E([0, 0, 62]) }, { t: 4.4, v: E([0, 0, 0]) }],
      'bone:handR': [{ t: 0.8, v: E([0, 0, 20]) }, { t: 1.3, v: E([0, 0, 55]) }, { t: 1.8, v: E([0, 0, 15]) }, { t: 2.3, v: E([0, 0, 55]) }, { t: 2.8, v: E([0, 0, 15]) }, { t: 3.3, v: E([0, 0, 50]) }, { t: 4.4, v: E([0, 0, 0]) }],
      'bone:head': [{ t: 0, v: E([0, 0, 0]) }, { t: 1.2, v: E([0, 0, -12]) }, { t: 2.6, v: E([8, 25, -6]) }, { t: 4.6, v: E([0, 0, 0]) }],
      'bone:chest': [{ t: 0, v: E([0, 0, 0]) }, { t: 1.5, v: E([0, 0, 5]) }, { t: 3, v: E([0, 0, -4]) }, { t: 4.5, v: E([0, 0, 0]) }],
      'morph:big': [{ t: 4.4, v: 0 }, { t: 4.8, v: 1, ease: 'backOut' }, { t: 5.5, v: 1 }, { t: 6, v: 0 }],
      'morph:squash': [{ t: 0, v: 0 }, { t: 0.25, v: 0.6 }, { t: 0.6, v: 0, ease: 'spring' }]
    };
    sc.objects.push(o);
    // eyes ride on the head bone
    const eye = MESHLIB.icosphere(3);
    for (const [id, x] of [['eyeR', 0.17], ['eyeL', -0.17]]) {
      sc.objects.push(newObj({ id, name: id === 'eyeR' ? 'Eye R' : 'Eye L', parent: 'buddy', parentBone: 'head', pos: [x, 2.02, 0.37], scl: [0.12, 0.16, 0.09], color: '#2B2B33', matcap: 'glossy' }));
      meshes[id] = { pos: eye.pos, idx: eye.idx, col: eye.col, mask: eye.mask, morphs: {}, skin: null };
    }
    const ball = MESHLIB.icosphere(4);
    sc.objects.push(newObj({ id: 'ball', name: 'Ball', pos: [1.9, 0.3, 0.6], scl: [0.6, 0.6, 0.6], color: '#6FA8DC', matcap: 'glossy',
      keys: { pos: [{ t: 0, v: [2.6, 2.2, 0.6] }, { t: 1.1, v: [1.9, 0.3, 0.6], ease: 'bounce' }], scl: [{ t: 1, v: [0.6, 0.6, 0.6] }, { t: 1.12, v: [0.72, 0.48, 0.72] }, { t: 1.4, v: [0.6, 0.6, 0.6], ease: 'spring' }] } }));
    meshes.ball = { pos: ball.pos, idx: ball.idx, col: ball.col, mask: ball.mask, morphs: {}, skin: null };
    sc.camKeys = [{ t: 0, v: { target: [0.3, 1.1, 0], yaw: 0.35, pitch: 0.12, dist: 6.2, fov: 40 } }, { t: 4.2, v: { target: [0.1, 1.5, 0], yaw: -0.1, pitch: 0.08, dist: 4.2, fov: 40 }, ease: 'smooth' }, { t: 6, v: { target: [0.3, 1.1, 0], yaw: 0.35, pitch: 0.12, dist: 6.2, fov: 40 } }];
    sc.view = { target: [0.2, 1.1, 0], yaw: 0.45, pitch: 0.15, dist: 6, fov: 40 };
    return { scene: sc, meshes };
  }

  // ---------- start ----------
  // ---------- inside Biostage: open what it asks for, say when ready, and hand back a GLB on request ----------
  const QS = new URLSearchParams(location.search), EMBED = QS.has('embed');
  const toParent = (msg, transfer) => { try { if (window.parent !== window) window.parent.postMessage(msg, '*', transfer || []); } catch (e) { } };
  let ready = false;
  if (EMBED) {
    document.body.classList.add('embed');
    addEventListener('message', async e => {
      if (e.source !== window.parent) return;
      const d = e.data || {};
      if (d.type === 'cf-ping' && ready) toParent({ type: 'cf-ready', projId });
      if (d.type !== 'cf-export') return;
      try {
        if (playing) setPlaying(false);
        await saveNow();
        const buf = await exportGLB().arrayBuffer();
        toParent({ type: 'cf-glb', buf, name: scene.name, projId }, [buf]);
      } catch (err) { toParent({ type: 'cf-error', message: (err && err.message) || String(err) }); }
    });
  }
  window.Clayframe = { scientist, starter, newFromStarter, exportGLB, saveNow, get projId() { return projId; }, embed: EMBED, openProject: (sc, m) => newProjectFrom(sc, m), get camObj() { return camObj; }, snapView, setLock, lock, viewPref, currentView, frameAll,  get scene() { return scene; }, setTime, setMode, get mode() { return mode; }, select: selectObj, addPrim, get sel() { return sel; }, MESH, cam, draw: () => { dirty = true; }, setPlaying, inp: touchInp, get lastEval() { return lastEval; }, openSheet };
  (async function init() {
    $('radius').value = brush.radius; $('strength').value = Math.round(brush.strength * 100);
    updSym();
    const cur = store.get('clayframe.current', null);
    let ok = false;
    if (EMBED && QS.get('proj')) { ok = await loadProject(QS.get('proj')).catch(() => false); if (!ok) toast('That sculpt isn’t in Clayframe on this device, so here’s a new one.'); }
    if (!ok && EMBED && QS.get('new')) ok = await newFromStarter(QS.get('new')).catch(e => { console.warn(e); return false; });
    if (!ok && !EMBED && cur) ok = await loadProject(cur).catch(() => false);
    if (!ok) { const dm = demo(); await newProjectFrom(dm.scene, dm.meshes); setMode('pose'); }
    $('dur').textContent = scene.duration;
    resize(); updUndo(); renderTools(); renderTimeline();
    requestAnimationFrame(loop);
    ready = true;
    if (EMBED) toParent({ type: 'cf-ready', projId });
  })();
})();

</script>
